[project]
name = "cgrophy"
version = "0.1.0"
description = "Cryptographic library"
readme = "README.md"
authors = [
    { name = "Brett Abamonte", email = "abamonteb@gmail.com" }
]
requires-python = ">=3.14"

[dependency-groups]
build = [
	"setuptools"
]
test = [
    "pytest"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.cgrophy]
includes = ["include/"]
libs = ["lib/"]
